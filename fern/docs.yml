instances:
- url: mathieu-s-org.docs.buildwithfern.com
title: Stripe's OpenAPI Specification
colors:
  accent-primary:
    light: '#635bff'
    dark: '#92adff'
  background:
    light: '#fafaff'
    dark: '#05050d'
  border:
    light: '#cfceda'
    dark: '#2c2c37'
logo:
  light: logo-light.png
  dark: logo-dark.png
  height: 20
favicon: logo-light.png
tabs:
  docs:
    display-name: Docs
    skip-slug: true
  api:
    display-name: API Reference
    skip-slug: true
