      slug: quickstart
    - page: Authentication
      path: ./pages/getting-started/authentication.mdx
      slug: authentication
  - section: Concepts
    slug: concepts
    contents:
    - page: Choosing the right spec file
      path: ./pages/concepts/choosing-a-spec.mdx
      slug: choosing-a-spec
    - page: v1, v2 and release phases
      path: ./pages/concepts/api-versions-and-release-phases.mdx
      slug: api-versions-and-release-phases
    - page: How the specs are organised
      path: ./pages/concepts/spec-structure.mdx
      slug: spec-structure
    - page: Vendor extensions and fixtures
